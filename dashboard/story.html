  .app{max-width:1180px; margin:0 auto; padding:20px 20px 40px; position:relative; z-index:1;}

  .display{font-family:"Bebas Neue",system-ui,sans-serif; letter-spacing:.02em; text-wrap:balance;}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;}
  .eyebrow{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:600;}

  /* ---------- header + nav ---------- */
  header.top{display:flex; align-items:baseline; justify-content:space-between; gap:16px; padding:6px 2px 18px; border-bottom:1px solid var(--border); margin-bottom:18px; flex-wrap:wrap;}
  header.top .brand{display:flex; flex-direction:column; gap:2px;}
  header.top .brand .title{font-family:"Bebas Neue",system-ui,sans-serif; font-size:26px; letter-spacing:.03em; line-height:1;}
  header.top .brand .sub{font-size:12.5px; color:var(--ink-2);}
  header.top .source{font-size:12px; color:var(--ink-muted); text-align:right;}
  header.top .source a{color:var(--ink-2);}

  nav.story-nav{display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:18px; scrollbar-width:thin;}
  nav.story-nav button{
    flex:0 0 auto; display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:9px 14px 9px 10px; cursor:pointer; color:var(--ink-2); font-size:12.5px; font-weight:500;
    transition:background .15s, color .15s, border-color .15s;
    max-width:190px;
  }
  nav.story-nav button .num{
    font-family:"IBM Plex Mono",monospace; font-size:11px; width:20px; height:20px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; background:var(--surface-2); color:var(--ink-muted); flex:0 0 auto;
  }
  nav.story-nav button .lbl{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  nav.story-nav button[aria-current="true"]{border-color:var(--accent); color:var(--ink); background:var(--accent-soft);}
  nav.story-nav button[aria-current="true"] .num{background:var(--accent); color:#fff;}
  nav.story-nav button:hover{border-color:var(--accent);}
  nav.story-nav button:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}

  /* ---------- panels ---------- */
  main{min-height:560px;}
  .panel{display:flex; flex-direction:column; gap:18px;}
  .panel[hidden]{display:none;}

  .panel-head{display:flex; flex-direction:column; gap:6px; max-width:760px;}
  .panel-head h1{font-family:"Bebas Neue",system-ui,sans-serif; font-size:clamp(28px,4vw,42px); line-height:1.02; margin:0; text-wrap:balance;}
  .panel-head p{margin:0; color:var(--ink-2); font-size:14.5px; line-height:1.55; max-width:66ch;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); padding:18px 20px 14px;}
  .card .card-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:6px; flex-wrap:wrap;}
  .card .card-head h2{font-size:14px; font-weight:600; margin:0; color:var(--ink);}
  .card .card-head .note{font-size:12px; color:var(--ink-muted); max-width:38ch; text-align:right;}
  .card svg{display:block; width:100%; height:auto;}

  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:820px){ .grid-2{grid-template-columns:1fr;} }

  /* ---------- hero (screen 1) ---------- */
  .hero{
    position:relative; border-radius:16px; overflow:hidden; border:1px solid var(--border); box-shadow:var(--shadow);
    padding:44px 32px 36px; color:#fff;

  {label:"2010–2025", n:16, dom:0.844, exp:0.575}
];

var INFLECTIONS = [
  {y0:1980, y1:1982, label:"Crise da dívida externa", sub:"-33% em 2 anos", pos:"above"},
  {y0:2008, y1:2009, label:"Crise financeira global", sub:"-26,1%", pos:"above"},
  {y0:2011, y1:2012, label:"PROCONVE P7 (Euro 5)", sub:"-40,3%", pos:"above"},
  {y0:2014, y1:2016, label:"Recessão 2015–16", sub:"-56,8% em 2 anos", pos:"below"},
  {y0:2022, y1:2023, label:"PROCONVE P8 (Euro 6)", sub:"-37,9%", pos:"above"}
];

var fmtInt = function(n){ return Math.round(n).toLocaleString("pt-BR"); };
var fmtPct = function(n, dec){ dec = dec===undefined?1:dec; var s=n.toFixed(dec).replace(".",","); return (n>0?"+":"")+s+"%"; };
var COLOR = {prod:"var(--series-prod)", exp:"var(--series-exp)", emp:"var(--series-emp)"};

/* ============================================================
   SVG helpers
   ============================================================ */
var SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent){
  var e = document.createElementNS(SVGNS, tag);
  for(var k in attrs){ e.setAttribute(k, attrs[k]); }
  if(parent) parent.appendChild(e);
  return e;
}
function scaleLinear(d0,d1,r0,r1){ return function(v){ return r0 + (v-d0)/(d1-d0) * (r1-r0); }; }

var tooltipEl = document.getElementById("tooltip");
function showTip(x,y,html){
  tooltipEl.innerHTML = html;
  tooltipEl.hidden = false;
  var pad = 14, tw = tooltipEl.offsetWidth, th = tooltipEl.offsetHeight;
  var vx = Math.min(x+pad, window.innerWidth - tw - 10);
  var vy = Math.max(y - th - pad, 10);
  tooltipEl.style.left = vx+"px";
  tooltipEl.style.top = vy+"px";
}
function hideTip(){ tooltipEl.hidden = true; }

/* ============================================================
   CHART 1 — curva completa (screen 2)
   ============================================================ */
function drawCurve(svg){
  var W=1040,H=460,ML=60,MR=20,MT=46,MB=36;
  var pw=W-ML-MR, ph=H-MT-MB;
  svg.setAttribute("viewBox","0 0 "+W+" "+H);
  svg.setAttribute("role","img");
  svg.setAttribute("aria-label","Gráfico de linha: produção, emplacamento e exportação de caminhões, 1957 a 2025");
  var n=ANNUAL.length;
  var x = scaleLinear(0, n-1, ML, ML+pw);
  var y = scaleLinear(0, 260000, MT+ph, MT);

  // gridlines
  [0,50000,100000,150000,200000,250000].forEach(function(v){
    el("line",{x1:ML,x2:ML+pw,y1:y(v),y2:y(v),stroke:"var(--grid)","stroke-width":1},svg);
    el("text",{x:ML-8,y:y(v)+4,"text-anchor":"end","font-size":10,fill:"var(--ink-muted)",class:"mono"},svg).textContent = v===0?"0":(v/1000)+" mil";
  });
  // x ticks every 10 years
  ANNUAL.forEach(function(row,i){
    var yr=row[COLS.ano];
    if(yr % 10 === 0 || i===0 || i===n-1){
      el("text",{x:x(i),y:MT+ph+18,"text-anchor":"middle","font-size":10,fill:"var(--ink-muted)"},svg).textContent = yr;
      el("line",{x1:x(i),x2:x(i),y1:MT+ph,y2:MT+ph+4,stroke:"var(--baseline)"},svg);
    }
  });

  var seriesDefs = [
    {key:"emp", col:COLS.emp, color:"var(--series-emp)", name:"Emplacamento"},
    {key:"exp", col:COLS.exp, color:"var(--series-exp)", name:"Exportação"},
    {key:"prod", col:COLS.prod, color:"var(--series-prod)", name:"Produção"}
  ];
  var paths = {};
  seriesDefs.forEach(function(s){
    var d="";
    ANNUAL.forEach(function(row,i){
      var v=row[s.col];
      if(v===null||v===undefined) return;
      d += (d===""?"M":"L") + x(i).toFixed(1) + " " + y(v).toFixed(1) + " ";
    });
    var p = el("path",{d:d, fill:"none", stroke:s.color, "stroke-width":s.key==="prod"?2.4:2, "stroke-linecap":"round","stroke-linejoin":"round", "data-series":s.key},svg);
    paths[s.key]=p;
  });

  // inflection annotations (on Producao line) — leader line + label pinned
  // above or below the point, with a solid background plate so text stays
  // legible over the lines/gridlines behind it
  INFLECTIONS.forEach(function(inf){
    var i0 = ANNUAL.findIndex(function(r){return r[COLS.ano]===inf.y0;});
    var i1 = ANNUAL.findIndex(function(r){return r[COLS.ano]===inf.y1;});
    var xi = x((i0+i1)/2);
    var v = Math.max(ANNUAL[i0][COLS.prod], ANNUAL[i1][COLS.prod]);
    var pointY = y(v);
    var above = inf.pos !== "below";
    var yTop = above ? Math.max(pointY - 34, MT + 6) : Math.min(pointY + 16, MT+ph-24);
    var lineY1 = above ? yTop + 30 : yTop - 6;

    var line = el("line",{x1:xi,x2:xi,y1:lineY1,y2:pointY,class:"annot-line"},svg);
    var t1=el("text",{x:xi,y:yTop,"text-anchor":"middle",class:"annot-label","font-weight":600},svg);
    t1.textContent = inf.label;
    var t2=el("text",{x:xi,y:yTop+13,"text-anchor":"middle",class:"annot-label",fill:"var(--critical)"},svg);
    t2.textContent = inf.sub;

    var b1 = t1.getBBox(), b2 = t2.getBBox();
    var padX=6, padY=3;
    var bx = Math.min(b1.x,b2.x)-padX, by = Math.min(b1.y,b2.y)-padY;
    var bw = Math.max(b1.x+b1.width,b2.x+b2.width) - bx + padX;
    var bh = Math.max(b1.y+b1.height,b2.y+b2.height) - by + padY;
    var plate = el("rect",{x:bx,y:by,width:bw,height:bh,rx:5,fill:"var(--surface)",stroke:"var(--border)","stroke-width":1});
    svg.insertBefore(plate, t1);
  });

  // hover layer
  var hoverLine = el("line",{x1:0,x2:0,y1:MT,y2:MT+ph,stroke:"var(--ink-muted)","stroke-width":1,opacity:0},svg);
  var hoverDots = {};
  seriesDefs.forEach(function(s){ hoverDots[s.key] = el("circle",{r:4,fill:s.color,stroke:"var(--surface)","stroke-width":1.5,opacity:0},svg); });
  var overlay = el("rect",{x:ML,y:MT,width:pw,height:ph,fill:"transparent"},svg);
  overlay.addEventListener("mousemove", function(ev){
    var pt = svg.createSVGPoint(); pt.x=ev.clientX; pt.y=ev.clientY;
    var loc = pt.matrixTransform(svg.getScreenCTM().inverse());
    var i = Math.round((loc.x-ML)/pw*(n-1));
    i = Math.max(0, Math.min(n-1, i));
    var row = ANNUAL[i];
    hoverLine.setAttribute("x1",x(i)); hoverLine.setAttribute("x2",x(i)); hoverLine.setAttribute("opacity",1);
    var rows="";
    seriesDefs.forEach(function(s){
      var v = row[s.col];
      hoverDots[s.key].setAttribute("cx", x(i));
      if(v===null||v===undefined){ hoverDots[s.key].setAttribute("opacity",0); }
      else { hoverDots[s.key].setAttribute("cy", y(v)); hoverDots[s.key].setAttribute("opacity",1);
        rows += '<div class="tt-row"><span><span class="sw" style="background:'+s.color+'"></span>'+s.name+'</span><span>'+(v===null?"—":fmtInt(v))+'</span></div>';
      }
    });
    showTip(ev.clientX, ev.clientY, '<div class="tt-title">'+row[COLS.ano]+'</div>'+rows);
  });
  overlay.addEventListener("mouseleave", function(){
    hoverLine.setAttribute("opacity",0);
    Object.keys(hoverDots).forEach(function(k){hoverDots[k].setAttribute("opacity",0);});
    hideTip();
  });

  return {paths:paths};
}

/* ============================================================
   CHART 2 — comparação regulatória (screen 3)
   ============================================================ */
function drawRegulatory(svg){
  var W=1040,H=360,MT=20,MB=54,gap=48;
  svg.setAttribute("viewBox","0 0 "+W+" "+H);
  svg.setAttribute("role","img");
  svg.setAttribute("aria-label","Gráfico de barras comparando os ciclos de produção 2009-2014 e 2020-2025, ambos com queda de cerca de 40% no ano de entrada de nova norma de emissões");
  var facets = [
    {years:[2009,2010,2011,2012,2013,2014], title:"2009–2014 · PROCONVE P7", crash:2012, peak:2011},
    {years:[2020,2021,2022,2023,2024,2025], title:"2020–2025 · PROCONVE P8", crash:2023, peak:2022}
  ];
  var facetW = (W - gap)/2;
  var maxV = 230000;
  var ph = H-MT-MB;
  facets.forEach(function(f, fi){
    var fx0 = fi*(facetW+gap);
    el("text",{x:fx0,y:MT-4,"font-size":12,"font-weight":600,fill:"var(--ink)"},svg).textContent = f.title;
    var bw = (facetW/6) - 10;
    var y = scaleLinear(0, maxV, MT+ph, MT+14);
    // gridline at 0
    el("line",{x1:fx0,x2:fx0+facetW,y1:y(0),y2:y(0),stroke:"var(--baseline)"},svg);
    f.years.forEach(function(yr,i){
      var row = ANNUAL.find(function(r){return r[COLS.ano]===yr;});
      var v = row[COLS.prod];
      var bx = fx0 + i*(facetW/6) + 5;
      var byTop = y(v);
      var isCrash = yr===f.crash, isPeak = yr===f.peak;
      var fill = isCrash ? "var(--critical)" : (isPeak ? "var(--series-prod)" : "var(--ink-muted)");
      var opac = isCrash||isPeak ? 1 : 0.45;
      var rect = el("rect",{x:bx,y:byTop,width:bw,height:y(0)-byTop,rx:3,fill:fill,opacity:opac},svg);
      rect.addEventListener("mousemove",function(ev){
        showTip(ev.clientX,ev.clientY,'<div class="tt-title">'+yr+'</div><div class="tt-row"><span>Produção</span><span>'+fmtInt(v)+'</span></div>'+(row[COLS.prodVar]!==null?'<div class="tt-row"><span>Variação</span><span>'+fmtPct(row[COLS.prodVar])+'</span></div>':""));
      });
      rect.addEventListener("mouseleave",hideTip);
      el("text",{x:bx+bw/2,y:y(0)+16,"text-anchor":"middle","font-size":10,fill:"var(--ink-muted)"},svg).textContent = yr;
      if(isCrash){
        el("text",{x:bx+bw/2,y:byTop-8,"text-anchor":"middle","font-size":10.5,"font-weight":600,fill:"var(--critical)",class:"mono"},svg).textContent = fmtPct(row[COLS.prodVar],1);
      }
    });
  });
  return {};
}

    el("text",{x:ML-8,y:y(v)+4,"text-anchor":"end","font-size":10,fill:"var(--ink-muted)"},svg).textContent = v.toFixed(2);

/* ============================================================
   CHART 4 — scatter variação % produção x exportação (screen 5)
   ============================================================ */
function drawScatter(svg){
  var W=520,H=396,ML=50,MR=16,MT=16,MB=50;
  var pw=W-ML-MR, ph=H-MT-MB;
  svg.setAttribute("viewBox","0 0 "+W+" "+H);
  svg.setAttribute("role","img");
  svg.setAttribute("aria-label","Gráfico de dispersão: variação percentual anual de produção versus exportação, 2000 a 2025, com linha de tendência de inclinação positiva");
  var pts = ANNUAL.filter(function(r){return r[COLS.ano]>=2000 && r[COLS.prodVar]!==null && r[COLS.expVar]!==null;});
  var xs = pts.map(function(r){return r[COLS.prodVar];});
  var ys = pts.map(function(r){return r[COLS.expVar];});
  var xMin=Math.min.apply(null,xs), xMax=Math.max.apply(null,xs);
  var yMin=Math.min.apply(null,ys), yMax=Math.max.apply(null,ys);
  var padX=(xMax-xMin)*0.12, padY=(yMax-yMin)*0.12;
  var x = scaleLinear(xMin-padX, xMax+padX, ML, ML+pw);
  var y = scaleLinear(yMin-padY, yMax+padY, MT+ph, MT);

  // zero lines
  el("line",{x1:x(0),x2:x(0),y1:MT,y2:MT+ph,stroke:"var(--grid)"},svg);
  el("line",{x1:ML,x2:ML+pw,y1:y(0),y2:y(0),stroke:"var(--grid)"},svg);
  el("text",{x:ML+pw/2,y:MT+ph+34,"text-anchor":"middle","font-size":10,fill:"var(--ink-muted)"},svg).textContent = "Variação da produção →";
  var yl = el("text",{x:14,y:MT+8,"font-size":10,fill:"var(--ink-muted)"},svg); yl.textContent="↑ exportação";

  // linear regression (least squares)
  var nP=xs.length, sx=0,sy=0,sxy=0,sxx=0;
  for(var i=0;i<nP;i++){ sx+=xs[i]; sy+=ys[i]; sxy+=xs[i]*ys[i]; sxx+=xs[i]*xs[i]; }
  var slope = (nP*sxy - sx*sy)/(nP*sxx - sx*sx);
  var intercept = (sy - slope*sx)/nP;
  var lx0=xMin-padX, lx1=xMax+padX;
  el("line",{x1:x(lx0),y1:y(slope*lx0+intercept),x2:x(lx1),y2:y(slope*lx1+intercept),stroke:"var(--accent)","stroke-width":2,"stroke-dasharray":"5 4"},svg);

  pts.forEach(function(r){
    var c = el("circle",{cx:x(r[COLS.prodVar]),cy:y(r[COLS.expVar]),r:5,fill:"var(--series-prod)",opacity:0.8,stroke:"var(--surface)","stroke-width":1},svg);
    c.addEventListener("mousemove",function(ev){
      showTip(ev.clientX,ev.clientY,'<div class="tt-title">'+r[COLS.ano]+'</div><div class="tt-row"><span>Produção</span><span>'+fmtPct(r[COLS.prodVar])+'</span></div><div class="tt-row"><span>Exportação</span><span>'+fmtPct(r[COLS.expVar])+'</span></div>');
    });
    c.addEventListener("mouseleave",hideTip);
  });
  // axis ticks (min/max)
  [xMin,0,xMax].forEach(function(v){ el("text",{x:x(v),y:MT+ph+18,"text-anchor":"middle","font-size":9.5,fill:"var(--ink-muted)"},svg).textContent=Math.round(v)+"%"; });
  return {};
}

/* ============================================================
   CHART 5 — participação da exportação na produção (screen 5)
   ============================================================ */
function drawExportShare(svg){
  var W=520,H=380,ML=44,MR=14,MT=16,MB=34;
  var pw=W-ML-MR, ph=H-MT-MB;
  svg.setAttribute("viewBox","0 0 "+W+" "+H);
  svg.setAttribute("role","img");
  svg.setAttribute("aria-label","Gráfico de barras: participação percentual da exportação na produção total de caminhões, 1965 a 2025, com pico em 2016 e 2017");
  var rows = ANNUAL.filter(function(r){return r[COLS.expPct]!==null;});
  var n = rows.length;
  var x = scaleLinear(0, n-1, ML, ML+pw);
  var y = scaleLinear(0, 38, MT+ph, MT);
  var avg = rows.reduce(function(a,r){return a+r[COLS.expPct];},0)/n;
  [0,10,20,30].forEach(function(v){
    el("line",{x1:ML,x2:ML+pw,y1:y(v),y2:y(v),stroke:"var(--grid)"},svg);
    el("text",{x:ML-6,y:y(v)+3,"text-anchor":"end","font-size":9,fill:"var(--ink-muted)"},svg).textContent=v+"%";
  });
  el("line",{x1:ML,x2:ML+pw,y1:y(avg),y2:y(avg),stroke:"var(--ink-muted)","stroke-width":1,"stroke-dasharray":"3 3"},svg);
  el("text",{x:ML+pw,y:y(avg)-4,"text-anchor":"end","font-size":9,fill:"var(--ink-muted)"},svg).textContent="média "+avg.toFixed(1)+"%";
  var bw = Math.max(pw/n - 1.2, 1);
  rows.forEach(function(r,i){
    var yr=r[COLS.ano], v=r[COLS.expPct];
    var hi = (yr===2016||yr===2017);
    var rect = el("rect",{x:x(i)-bw/2,y:y(v),width:bw,height:y(0)-y(v),fill:hi?"var(--series-exp)":"var(--series-exp)",opacity:hi?1:0.35},svg);
    rect.addEventListener("mousemove",function(ev){
      showTip(ev.clientX,ev.clientY,'<div class="tt-title">'+yr+'</div><div class="tt-row"><span>Exportação / produção</span><span>'+v.toFixed(1)+'%</span></div>');
    });
    rect.addEventListener("mouseleave",hideTip);
    if(yr%10===0 || i===0 || i===n-1){ el("text",{x:x(i),y:MT+ph+15,"text-anchor":"middle","font-size":9,fill:"var(--ink-muted)"},svg).textContent=yr; }
  });
  return {};
}

/* ============================================================
   NAV / RENDER LOOP
   ============================================================ */
var current = 0;
var navEl = document.getElementById("storyNav");
var mainEl = document.getElementById("main");
var pageIdx = document.getElementById("pageIdx");
var btnPrev = document.getElementById("btnPrev");
var btnNext = document.getElementById("btnNext");

STORY.forEach(function(sp, i){
  var b = document.createElement("button");
  b.innerHTML = '<span class="num">'+(i+1)+'</span><span class="lbl">'+sp.nav+'</span>';
  b.addEventListener("click", function(){ goTo(i); });
  navEl.appendChild(b);
});

function goTo(i){
  current = Math.max(0, Math.min(STORY.length-1, i));
  mainEl.innerHTML = "";
  var section = document.createElement("section");
  section.className = "panel";
  mainEl.appendChild(section);
  STORY[current].render(section);
  Array.prototype.forEach.call(navEl.children, function(b,j){
    b.setAttribute("aria-current", j===current ? "true":"false");
  });
  pageIdx.textContent = (current+1)+" / "+STORY.length;
  btnPrev.disabled = current===0;
  btnNext.disabled = current===STORY.length-1;
  window.scrollTo({top:0, behavior:"instant"});
}
btnPrev.addEventListener("click", function(){ goTo(current-1); });
btnNext.addEventListener("click", function(){ goTo(current+1); });
document.addEventListener("keydown", function(ev){
  if(ev.key==="ArrowRight") goTo(current+1);
  if(ev.key==="ArrowLeft") goTo(current-1);
});

goTo(0);
})();
</script>
